<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />

    <!-- Polices : auto-hébergées (paquets @fontsource importés dans
         src/main.jsx), servies depuis ce domaine. Plus aucun tiers ne reçoit
         l'adresse IP des visiteurs au chargement de la page (point RGPD). -->

    <!-- PWA core -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFE8CF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1008" media="(prefers-color-scheme: dark)" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Groply" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Icônes navigateur -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- SEO / partage -->
    <meta name="description" content="Progresser à la guitare — impro, théorie, manche" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Groply" />
    <meta property="og:description" content="Progresser à la guitare — impro, théorie, manche" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Viewport. `maximum-scale` et `user-scalable=no` sont volontairement
         ABSENTS : les interdire empêche le zoom, ce qui est un échec WCAG
         1.4.4 et une plaie pour lire une tablature. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Groply — progresser à la guitare</title>

    <!-- Fond posé avant le premier rendu : évite le flash blanc au lancement
         de la PWA, sans attendre le JS. -->
    <style>
      html { background: #FFE8CF; }
      @media (prefers-color-scheme: dark) { html { background: #1A1008; } }
      /* Message de secours : visible seulement si l'app n'a pas démarré
         après 8 s (React remplace tout le contenu de #root au démarrage).
         Jamais de page blanche muette, même si le script ne se charge pas. */
      .gr-secours {
        min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 12px; padding: 24px; text-align: center;
        font: 15px/1.6 -apple-system, system-ui, sans-serif; color: #18130F;
        visibility: hidden; animation: gr-secours 0s linear 8s forwards;
      }
      .gr-secours strong { font-size: 18px; }
      .gr-secours a { color: #C64E12; font-weight: 700; }
      @media (prefers-color-scheme: dark) { .gr-secours { color: #F5EBDD; } .gr-secours a { color: #FF9A5C; } }
      @keyframes gr-secours { to { visibility: visible; } }
    </style>
  </head>

  <body>
    <div id="root"><div class="gr-secours">
      <strong>Groply n'arrive pas à démarrer.</strong>
      <span>Recharge la page. Si rien ne change, mets à jour iOS (ou Safari), puis réessaie.</span>
      <a href="/">Recharger</a>
    </div></div>
    <noscript style="display:block;padding:24px;font-family:sans-serif;text-align:center">
      Groply a besoin de JavaScript pour fonctionner. Active-le puis recharge la page.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
