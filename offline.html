<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#FFE8CF">
  <title>Groply · Hors-ligne</title>
  <style>
    :root{--t:#18130F;--t2:#6E6760;--bg:#FFE8CF;--p:#C64E12}
    @media(prefers-color-scheme:dark){:root{--t:#F5E8D8;--t2:#C0A882;--bg:#1A1008;--p:#E85D1A}}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--t);
      font-family:'Poppins','Segoe UI',system-ui,sans-serif}
    body{display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:32px 24px;text-align:center}
    img.gropi{margin-bottom:24px;filter:drop-shadow(0 8px 20px rgba(232,93,26,.28))}
    h1{font-size:23px;font-weight:800;letter-spacing:-.3px;margin-bottom:10px}
    p{font-size:15px;color:var(--t2);line-height:1.65;max-width:320px}
    button{margin-top:28px;padding:15px 28px;background:var(--p);color:#fff;border:none;
      border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
      min-height:48px}
    button:active{transform:scale(.97)}
    button:focus-visible{outline:3px solid #0A4FB0;outline-offset:2px}
  </style>
</head>
<body>
  <!-- Précaché par le service worker : l'image s'affiche même hors-ligne. -->
  <img class="gropi" src="/mascotte-think.svg" width="120" height="138"
       alt="Gropi réfléchit, en attente de connexion">

  <h1>Pas de connexion</h1>
  <p>Gropi est là, mais le réseau non. Ta progression est enregistrée sur cet
     appareil : elle se synchronisera dès le retour du réseau, rien n'est perdu.</p>
  <p style="margin-top:12px;font-size:13px">
     Les cours, exercices et sons déjà chargés restent accessibles.</p>
  <button onclick="location.reload()">Réessayer</button>
</body>
</html>
