<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#E85D1A">
  <title>Groply · Hors-ligne</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#FAF8F5;font-family:'Poppins','Segoe UI',sans-serif;color:#18130F}
    body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center}
    img.gropi{margin-bottom:24px;filter:drop-shadow(0 8px 20px #E85D1A44)}
    h1{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:10px}
    p{font-size:14px;color:#7A736A;line-height:1.6;max-width:300px}
    button{margin-top:28px;padding:13px 28px;background:#E85D1A;color:#fff;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px #E85D1A44}
    button:active{transform:scale(.97)}
  </style>
</head>
<body>
  <!--
    Mascotte officielle (pose "think") au lieu d'un SVG dessiné à part.
    Ce fichier est précaché par le service worker (sw.js), donc l'image
    s'affiche même hors-ligne — pas besoin de la dupliquer en inline.
  -->
  <img class="gropi" src="/mascotte-think.svg" width="120" height="138" alt="Gropi réfléchit, en attente de connexion">

  <h1>Pas de connexion</h1>
  <p>Gropi est là, mais le réseau non. Reconnecte-toi pour synchroniser ta progression.</p>
  <p style="margin-top:10px;font-size:12px;color:#A09890">Les cours et exercices déjà chargés restent accessibles.</p>
  <button onclick="location.reload()">Réessayer</button>
</body>
</html>
